{% extends 'base.html' %}

{% block title %}用語学習{% endblock %}

{% block content %}
<div class="mx-auto max-w-6xl">
  <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    <h1 class="text-3xl font-bold text-slate-950">用語一覧</h1>
    <form method="get" action="{{ url_for('terms') }}" class="mt-6 grid gap-3 md:grid-cols-[1fr_1fr_auto]">
      <input type="text" name="search" value="{{ request.args.get('search', '') }}" placeholder="単語検索" class="rounded-xl border border-slate-300 px-4 py-3 text-sm font-semibold text-slate-800" />
      <select name="category" class="rounded-xl border border-slate-300 px-4 py-3 text-sm font-semibold text-slate-800">
        <option value="">すべてのカテゴリ</option>
        {% for category in categories %}
          <option value="{{ category }}" {% if category == selected_category %}selected{% endif %}>{{ category }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="rounded-xl bg-emerald-600 px-6 py-3 text-sm font-bold text-white hover:bg-emerald-700">絞り込む</button>
    </form>
  </section>

  <section class="mt-6 space-y-4">
    {% if terms %}
      {% for term in terms %}
        <a href="{{ url_for('term_detail', term_id=term.id) }}" class="block rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:border-emerald-300 hover:bg-slate-50">
          <div class="flex items-center justify-between gap-4">
            <div>
              <p class="text-lg font-bold text-slate-950">{{ term.name }}</p>
              <p class="mt-1 text-sm font-semibold text-slate-500">{{ term.category }} / {{ term.difficulty }}</p>
            </div>
            <span class="rounded-lg bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700">詳細</span>
          </div>
        </a>
      {% endfor %}
    {% else %}
      <div class="rounded-2xl border border-slate-200 bg-white p-8 text-center text-sm font-bold text-slate-600">該当する用語がありません。</div>
    {% endif %}
  </section>
</div>
{% endblock %}
