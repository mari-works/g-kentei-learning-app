{% extends 'base.html' %}

{% block title %}用語詳細 - {{ term.name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-5xl">
  <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-sm font-bold uppercase tracking-[0.22em] text-slate-400">用語詳細</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">{{ term.name }}</h1>
        <p class="mt-2 text-sm font-semibold text-slate-500">{{ term.category }} / {{ term.difficulty }}</p>
      </div>
      <a href="{{ url_for('practice') }}" class="rounded-xl bg-emerald-600 px-5 py-3 text-sm font-bold text-white hover:bg-emerald-700">関連問題を解く</a>
    </div>
  </section>

  <section class="mt-6 grid gap-5 md:grid-cols-2">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-bold text-slate-950">説明</h2>
      <p class="mt-4 leading-8 text-slate-800">{{ term.definition }}</p>
    </div>
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-bold text-slate-950">例</h2>
      <p class="mt-4 leading-8 text-slate-800">{{ term.example }}</p>
    </div>
  </section>
</div>
{% endblock %}
